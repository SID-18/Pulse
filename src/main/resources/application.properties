spring.application.name=pulse

spring.datasource.url=jdbc:postgresql://localhost:5432/pulse
spring.datasource.username=postgres
spring.datasource.password=${PULSE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Memurai is Redis-compatible and runs locally as the cache server.
spring.data.redis.host=${PULSE_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${PULSE_REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

spring.cache.type=redis
spring.cache.redis.time-to-live=60s
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=pulse::

spring.kafka.bootstrap-servers=${PULSE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=pulse-audit
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.pulse.event.kafka

pulse.kafka.topics.incident-events=incident-events

pulse.jwt.secret=${PULSE_JWT_SECRET}
pulse.jwt.expiration-minutes=60
pulse.security.enabled=true

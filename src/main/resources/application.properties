spring.application.name=pulse

spring.datasource.url=jdbc:postgresql://localhost:5432/pulse
spring.datasource.username=postgres
spring.datasource.password=${PULSE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Memurai is Redis-compatible and runs locally as the cache server.
spring.data.redis.host=${PULSE_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${PULSE_REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

spring.cache.type=redis
spring.cache.redis.time-to-live=60s
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=pulse::

pulse.jwt.secret=${PULSE_JWT_SECRET}
pulse.jwt.expiration-minutes=60
pulse.security.enabled=true

name: pulse

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores versioned database files under this directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:4.2.1
    # Docker creates named volumes as root; use root only for this local KRaft
    # broker so it can initialize its persisted metadata directory.
    user: "0:0"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      PULSE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PULSE_REDIS_HOST: redis
      PULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PULSE_OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET}
      PULSE_METRICS_USERNAME: ${PULSE_METRICS_USERNAME:-pulse-metrics}
      PULSE_METRICS_PASSWORD: ${PULSE_METRICS_PASSWORD:-PulseMetricsDevOnly!2026}
      PULSE_OLLAMA_BASE_URL: http://host.docker.internal:11434
      PULSE_OLLAMA_MODEL: ${PULSE_OLLAMA_MODEL}
      PULSE_BOOTSTRAP_ADMIN_NAME: ${PULSE_BOOTSTRAP_ADMIN_NAME:-Pulse Docker Admin}
      PULSE_BOOTSTRAP_ADMIN_EMAIL: ${PULSE_BOOTSTRAP_ADMIN_EMAIL:-admin@pulse.local}
      PULSE_BOOTSTRAP_ADMIN_PASSWORD: ${PULSE_BOOTSTRAP_ADMIN_PASSWORD:-PulseDockerPass!2026}
      PULSE_BOOTSTRAP_ADMIN_TEAM_NAME: ${PULSE_BOOTSTRAP_ADMIN_TEAM_NAME:-Platform Operations}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-collector:
        condition: service_started

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: on-failure
    depends_on:
      - tempo

  alertmanager:
    image: prom/alertmanager:v0.34.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./observability/prometheus/metrics-password:/etc/prometheus/secrets/metrics-password:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: on-failure
    depends_on:
      - backend
      - alertmanager

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaDevOnly!2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: on-failure
    depends_on:
      - prometheus

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      PULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PULSE_OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8081:8081"
    restart: on-failure
    depends_on:
      kafka:
        condition: service_started
      otel-collector:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  tempo-data:

name: pulse

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores versioned database files under this directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:4.2.1
    # Docker creates named volumes as root; use root only for this local KRaft
    # broker so it can initialize its persisted metadata directory.
    user: "0:0"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      PULSE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PULSE_REDIS_HOST: redis
      PULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET}
      PULSE_OLLAMA_BASE_URL: http://ollama:11434
      PULSE_OLLAMA_MODEL: ${PULSE_OLLAMA_MODEL}
      PULSE_RAG_BASE_URL: http://ai-service:8002
      PULSE_NOTIFICATION_BASE_URL: http://notification-service:8081
      PULSE_BOOTSTRAP_ADMIN_NAME: ${PULSE_BOOTSTRAP_ADMIN_NAME:-Pulse Docker Admin}
      PULSE_BOOTSTRAP_ADMIN_EMAIL: ${PULSE_BOOTSTRAP_ADMIN_EMAIL:-admin@pulse.local}
      PULSE_BOOTSTRAP_ADMIN_PASSWORD: ${PULSE_BOOTSTRAP_ADMIN_PASSWORD:-PulseDockerPass!2026}
      PULSE_BOOTSTRAP_ADMIN_TEAM_NAME: ${PULSE_BOOTSTRAP_ADMIN_TEAM_NAME:-Platform Operations}
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      ai-service:
        condition: service_started
      ollama:
        condition: service_started
      notification-service:
        condition: service_started

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/data
    restart: on-failure

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-data:/root/.ollama
    restart: on-failure

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      PULSE_CHROMA_HOST: chroma
      PULSE_CHROMA_PORT: 8000
      PULSE_OLLAMA_BASE_URL: http://ollama:11434
      PULSE_OLLAMA_MODEL: ${PULSE_OLLAMA_MODEL}
      PULSE_OLLAMA_EMBEDDING_MODEL: ${PULSE_OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
    expose:
      - "8002"
    restart: on-failure
    depends_on:
      - chroma
      - ollama

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      PULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PULSE_REDIS_HOST: redis
    ports:
      - "8081:8081"
    restart: on-failure
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  chroma-data:
  ollama-data:

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pulse-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: pulse-metrics
      password_file: /etc/prometheus/secrets/metrics-password
    static_configs:
      - targets: ["backend:8080"]

  - job_name: pulse-notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8081"]

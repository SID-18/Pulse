global:
  resolve_timeout: 5m

route:
  receiver: local-dashboard
  group_by: [alertname, service, severity]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

# This receiver intentionally has no external delivery configuration. Alerts are
# visible in the local Alertmanager UI while email, Slack, or PagerDuty
# integrations are configured only for a real deployment.
receivers:
  - name: local-dashboard

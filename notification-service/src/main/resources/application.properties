spring.application.name=pulse-notification-service
server.port=8081

spring.kafka.bootstrap-servers=${PULSE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.consumer.group-id=pulse-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.pulse.notification.kafka
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.pulse.notification.kafka.NotificationEvent
spring.kafka.listener.ack-mode=record
spring.kafka.listener.observation-enabled=true

pulse.kafka.topics.incident-events=incident-events
pulse.kafka.consumer.retry-backoff-ms=1000
pulse.kafka.consumer.retry-attempts=2

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${PULSE_OTEL_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.otlp.metrics.export.enabled=false
info.app.name=Pulse Notification Service
info.app.description=Kafka-driven notification service for Pulse
